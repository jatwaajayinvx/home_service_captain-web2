@if (isLoggedIn()) {
<nav class="navbar navbar-expand-lg bg-white border-bottom shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" routerLink="/home">
            <i class="bi bi-tools me-2"></i>
            Home Service Captain
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#customerNavbar"
            aria-controls="customerNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="customerNavbar">
            <div class="navbar-nav ms-auto align-items-lg-center">
                <a class="nav-link" routerLink="/home" routerLinkActive="active">
                    <i class="bi bi-house me-1"></i>
                    Home
                </a>
                <a class="nav-link" routerLink="/my-bookings" routerLinkActive="active">
                    <i class="bi bi-calendar-check me-1"></i>
                    My Bookings
                </a>
                <a class="nav-link notification-link" routerLink="/notifications" routerLinkActive="active">
                    <i class="bi bi-bell me-1"></i>
                    Notifications
                    @if (unreadCount > 0) {
                    <span class="badge bg-danger ms-1">
                        {{ unreadCount }}
                    </span>
                    }
                </a>
                <a class="nav-link" routerLink="/profile" routerLinkActive="active">
                    <i class="bi bi-person-circle me-1"></i>
                    Profile
                </a>
                <button type="button" class="btn btn-outline-danger btn-sm ms-lg-3 mt-2 mt-lg-0" (click)="logout()">
                    <i class="bi bi-box-arrow-right me-1"></i>
                    Logout
                </button>
            </div>
        </div>
    </div>
</nav>
}
<main>
    <router-outlet></router-outlet>
</main>
